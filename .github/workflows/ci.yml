name: CI

on:
  push:
    branches: ["main", "dev"]
  pull_request:
    branches: ["main", "dev", "feat/**"]

# The workflow reads the repository and nothing else; it references no secrets.
permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Lint & Format
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.13"

      - name: Install uv
        uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          enable-cache: true

      - name: Install dependencies
        run: uv sync --frozen --all-packages

      # The same set the Makefile's PY_SOURCES names: the FastAPI app, the arq
      # worker, the two MCP sidecars and scripts/ were outside this gate.
      - name: Ruff lint
        run: uv run ruff check src/ tests/ apps/api/ services/ scripts/

      - name: Ruff format check
        run: uv run ruff format --check src/ tests/ apps/api/ services/ scripts/

      - name: Changelog fragments
        run: uv run python scripts/changelog/fold.py --check

      - name: mypy type check
        run: uv run mypy src/ apps/api/

  semgrep:
    name: Semgrep
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: quality
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.13"
      - name: Install uv
        uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          enable-cache: true
      # The Makefile's `make semgrep` form: uv resolves the pinned version into
      # an ephemeral environment, so no unpinned `pip install` runs in CI.
      #
      # apps/web/src is in the target list and the TypeScript and React
      # rulesets are in the config list: the console is application code that
      # reads a live event feed, and leaving it to CodeQL alone made every file
      # of it single-tool. What stays out of the scan is what is not source —
      # build output, the end-to-end suite, the unit specs (`.semgrepignore`).
      - name: Scan
        run: uv run --with semgrep==1.176.0 semgrep scan --config p/python --config p/security-audit --config p/typescript --config p/react --error --metrics=off src/ apps/api/ services/ scripts/ apps/web/src/

  # The suite runs in shards on parallel runners; scripts/ci/shard_map.py
  # holds the map and the development guide says how it is balanced. The
  # required check "Test Suite (Python 3.13)" is the job at the end, which
  # passes only when every shard passed and the shards were shown to cover the
  # suite.
  test-shard:
    name: Tests (3.13, shard ${{ matrix.shard }}/6)
    runs-on: ubuntu-latest
    timeout-minutes: 45
    needs: quality

    strategy:
      fail-fast: false
      matrix:
        # 1..SUITES["linux"].shards in scripts/ci/shard_map.py.
        shard: [1, 2, 3, 4, 5, 6]

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # The required check's name, "Test Suite (Python 3.13)", names this
      # version.
      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.13"

      - name: Install uv
        uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          enable-cache: true

      - name: Install dependencies
        run: uv sync --frozen --all-packages

      # The JUnit report carries each test's seconds, which rebalance the map.
      - name: Run test shard
        env:
          SHARD: ${{ matrix.shard }}
        run: |
          uv run python scripts/ci/shard_map.py --suite linux --shard "$SHARD" > "$RUNNER_TEMP/shard-paths"
          # pytest given no path would run its whole test path.
          test -s "$RUNNER_TEMP/shard-paths"
          mapfile -t paths < "$RUNNER_TEMP/shard-paths"
          uv run pytest "${paths[@]}" -q --tb=short --junitxml="$RUNNER_TEMP/junit-linux-$SHARD.xml"

      - name: Upload test durations
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: junit-linux-${{ matrix.shard }}
          path: ${{ runner.temp }}/junit-linux-${{ matrix.shard }}.xml
          retention-days: 14

  # The shards together must collect exactly what `pytest tests/` collects: a
  # test in no shard, or in two, fails here.
  test-shard-map:
    name: Test shard map
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: quality

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.13"

      - name: Install uv
        uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          enable-cache: true

      - name: Install dependencies
        run: uv sync --frozen --all-packages

      - name: Every test is in exactly one shard
        run: |
          uv run python scripts/ci/shard_map.py --suite linux --list
          uv run python scripts/ci/shard_map.py --suite linux --check

  test:
    name: Test Suite (Python 3.13)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: [test-shard, test-shard-map]
    # Runs whatever the shards' outcome, so a failed, cancelled or skipped
    # shard fails this check instead of leaving it skipped.
    if: always()

    steps:
      - name: Every shard passed and the map is complete
        env:
          SHARDS: ${{ needs.test-shard.result }}
          SHARD_MAP: ${{ needs.test-shard-map.result }}
        run: |
          echo "shards: $SHARDS, shard map: $SHARD_MAP"
          test "$SHARDS" = success
          test "$SHARD_MAP" = success

  test-qdrant:
    name: Qdrant Live Tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: quality

    services:
      qdrant:
        image: qdrant/qdrant:v1.18.3@sha256:0bd98fa7977f1e75694779359ca4e212822e5a71334e28421182f72f209d5286
        ports:
          - 6333:6333

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Wait for Qdrant to be ready
        run: |
          echo "Waiting for Qdrant..."
          for i in $(seq 1 30); do
            if curl -sf http://localhost:6333/ > /dev/null 2>&1; then
              echo "Qdrant is ready after ${i} attempts."
              break
            fi
            echo "  attempt $i/30 — retrying in 2s"
            sleep 2
          done
          curl -sf http://localhost:6333/ || (echo "Qdrant did not start in time" && exit 1)

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.13"

      - name: Install uv
        uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          enable-cache: true

      - name: Install dependencies
        run: uv sync --frozen --all-packages

      - name: Run Qdrant live tests
        env:
          QDRANT_URL: http://localhost:6333
        run: uv run pytest tests/unit/test_qdrant_store.py -v

  frontend:
    name: Frontend (tsc, eslint, next build)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: quality

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: apps/web/package-lock.json

      - name: Install frontend dependencies
        working-directory: apps/web
        run: npm ci

      # A TypeScript error used to surface only when docker/Dockerfile.frontend
      # ran `next build` at deploy time; the e2e job mocks every route and never
      # compiles the production bundle.
      - name: Type check
        working-directory: apps/web
        run: npx tsc --noEmit

      - name: Lint
        working-directory: apps/web
        run: npm run lint

      - name: Unit tests
        working-directory: apps/web
        run: npm run test:unit

      - name: Production build
        working-directory: apps/web
        env:
          NEXT_TELEMETRY_DISABLED: "1"
        run: npm run build

  # Known advisories in the npm packages that ship (dev tooling left out), read
  # from each lockfile with no install. A job of its own and not a required
  # check: an advisory published overnight must not block an unrelated merge,
  # and the registry being unreachable is not a finding. The console fails at
  # high or critical, and the audit is retried once for the network. The
  # package in apps/docs is only the docs content check, which runs in CI and
  # ships nothing, so it is not audited.
  npm-audit:
    name: npm audit
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22"

      - name: Audit the console (high and above fail)
        working-directory: apps/web
        run: |
          npm audit --audit-level=high --omit=dev || {
            sleep 20
            npm audit --audit-level=high --omit=dev
          }

  e2e:
    name: E2E Tests (Playwright)
    runs-on: ubuntu-latest
    timeout-minutes: 80
    needs: quality

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: apps/web/package-lock.json

      - name: Install frontend dependencies
        working-directory: apps/web
        run: npm ci

      # A hung download holds the pull request for the job limit, so each
      # attempt is cut at ten minutes (measured: median 1, longest 6) and a
      # second one runs if the first fails or is cut; the job fails only if
      # both do.
      - name: Install Playwright browsers
        id: browsers
        working-directory: apps/web
        timeout-minutes: 10
        continue-on-error: true
        run: npx playwright install --with-deps

      - name: Install Playwright browsers (second attempt)
        if: steps.browsers.outcome == 'failure'
        working-directory: apps/web
        timeout-minutes: 10
        run: npx playwright install --with-deps

      # Same entry point developers use. The wrapper strips Snap-injected env
      # that crashes WebKit on a confined desktop; on a runner there is nothing
      # to strip and it exec's straight through, so CI and local runs cannot
      # drift apart.
      - name: Run Playwright tests
        working-directory: apps/web
        run: npm run test:e2e
