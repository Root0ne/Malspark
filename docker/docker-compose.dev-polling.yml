# The development stack's reloads by polling, for a host that is not Linux.
#
#   docker compose -f docker/docker-compose.yml -f docker/docker-compose.dev.yml \
#     -f docker/docker-compose.named-data.yml -f docker/docker-compose.dev-polling.yml up -d
#
# scripts/dev/malspark_dev.py adds this file to the development stack on a
# host that is not Linux, whatever MALSPARK_DATA_VOLUMES says, after the
# named-data overlay when it adds that one. Docker Desktop shares the host's
# files with its Linux machine through a file system that delivers no change
# notification for an edit made on the host, so the worker's and the API's
# watchfiles and Next's watchers, which wait for one, never reload. Here each
# looks for changes once a second instead.

services:
  # watchfiles reads both variables (uvicorn's reloader and the worker's
  # supervisor alike). The API's reload watches the two source trees only, so
  # its polling does not walk the rule corpora and the environment under /app.
  backend-api:
    command: >
      uv run uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload
      --reload-dir /app/src --reload-dir /app/apps/api
    environment:
      WATCHFILES_FORCE_POLLING: "true"
      WATCHFILES_POLL_DELAY_MS: "1000"

  backend-worker:
    environment:
      WATCHFILES_FORCE_POLLING: "true"
      WATCHFILES_POLL_DELAY_MS: "1000"

  # MALSPARK_WATCH_POLL_MS is read by apps/web/next.config.ts as
  # watchOptions.pollIntervalMs. `next dev`'s own watcher of its pages and
  # configuration (Watchpack) reads WATCHPACK_POLLING: a number is its
  # interval in milliseconds.
  frontend:
    environment:
      MALSPARK_WATCH_POLL_MS: "1000"
      WATCHPACK_POLLING: "1000"
